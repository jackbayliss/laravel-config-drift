name: Install From Packagist

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: PHP ${{ matrix.php }} - Latest Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        php: [8.5, 8.4, 8.3]

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Create Laravel application
        run: composer create-project laravel/laravel app --prefer-dist --no-interaction

      - name: Install package from Packagist
        working-directory: app
        run: composer require jackbayliss/laravel-config-drift --dev --no-interaction

      - name: List installed versions
        working-directory: app
        run: composer show -D

      - name: Run the command
        working-directory: app
        run: php artisan config:outdated

      - name: Drift the application config file
        working-directory: app
        run: |
          if ! grep -q "'timezone' =>" config/app.php; then
            echo "::error::The 'timezone' key is no longer in the skeleton's config/app.php, pick another key to remove."
            exit 1
          fi

          sed -i "/'timezone' =>/d" config/app.php
          sed -i "s/^return \[/return [\n    'drift_check' => true,/" config/app.php

      - name: Detect the drifted keys
        working-directory: app
        run: |
          if php artisan config:outdated app --fail; then
            echo "::error::config:outdated did not fail for a drifted config file."
            exit 1
          fi

          php artisan config:outdated app --json | tee output.json

          jq -e '.[0].missing | index("app.timezone")' output.json > /dev/null \
            || { echo "::error::app.timezone was not reported as missing."; exit 1; }

          jq -e '.[0].unknown | index("app.drift_check")' output.json > /dev/null \
            || { echo "::error::app.drift_check was not reported as unknown."; exit 1; }
